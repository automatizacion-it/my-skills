name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main        # Cambia a 'master' si tu rama principal se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────
      # SEGURIDAD: Inyectar secretos como variables de entorno JS
      # La API Key NUNCA se guarda en el repositorio.
      # Se configura en: Repo → Settings → Secrets → Actions
      # ──────────────────────────────────────────────────────────────
      - name: 🔐 Generar config.js con secretos
        run: |
          cat > docs/js/config.js << 'HEREDOC_END'
          // ⚠️ ARCHIVO GENERADO AUTOMÁTICAMENTE POR GITHUB ACTIONS
          window.APP_CONFIG = {
            geminiApiKey:  "GEMINI_KEY_PLACEHOLDER",
            spotifyClientId: "SPOTIFY_ID_PLACEHOLDER",
            mqttHost:     "MQTT_HOST_PLACEHOLDER",
            mqttUser:     "MQTT_USER_PLACEHOLDER",
            mqttPassword: "MQTT_PASS_PLACEHOLDER"
          };
          HEREDOC_END

          sed -i "s|GEMINI_KEY_PLACEHOLDER|${{ secrets.GEMINI_API_KEY }}|g"     docs/js/config.js
          sed -i "s|SPOTIFY_ID_PLACEHOLDER|${{ secrets.SPOTIFY_CLIENT_ID }}|g"  docs/js/config.js
          sed -i "s|MQTT_HOST_PLACEHOLDER|${{ secrets.MQTT_HOST }}|g"           docs/js/config.js
          sed -i "s|MQTT_USER_PLACEHOLDER|${{ secrets.MQTT_USER }}|g"           docs/js/config.js
          sed -i "s|MQTT_PASS_PLACEHOLDER|${{ secrets.MQTT_PASSWORD }}|g"       docs/js/config.js

          echo "✅ config.js con MQTT y AI secrets generado correctamente"

      - name: 🔍 Verificar estructura (sin mostrar keys)
        run: |
          echo "Archivos en docs/js:"
          ls -la docs/js/
          echo "config.js generado: $(wc -c < docs/js/config.js) bytes"

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: 🚀 Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
